components:
  schemas:
    controllers.createShaderRequest:
      properties:
        content:
          type: string
        description:
          type: string
        name:
          type: string
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
        visibility:
          type: string
      type: object
    controllers.healthResponse:
      properties:
        status:
          type: string
      type: object
    controllers.loginRequest:
      properties:
        password:
          type: string
        username:
          type: string
      type: object
    controllers.registerRequest:
      properties:
        email:
          type: string
        password:
          type: string
        username:
          type: string
      type: object
    controllers.shaderResponse:
      properties:
        content:
          type: string
        createdAt:
          type: string
        createdBy:
          type: string
        description:
          type: string
        id:
          type: string
        location:
          type: string
        name:
          type: string
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
        updatedAt:
          type: string
        visibility:
          type: string
      type: object
    controllers.shaderSummaryResponse:
      properties:
        createdAt:
          type: string
        createdBy:
          type: string
        description:
          type: string
        id:
          type: string
        location:
          type: string
        name:
          type: string
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
        updatedAt:
          type: string
        visibility:
          type: string
      type: object
    controllers.updateShaderRequest:
      properties:
        content:
          type: string
        description:
          type: string
        name:
          type: string
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
        visibility:
          type: string
      type: object
    controllers.userResponse:
      properties:
        createdAt:
          type: string
        email:
          type: string
        emailVerificationStatus:
          type: string
        id:
          type: string
        updatedAt:
          type: string
        username:
          type: string
      type: object
    server.ErrorResponse:
      properties:
        causedBy:
          type: string
        errorClass:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: '"Bearer <token>", with the token from /api/v1/user/login'
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  title: WGSL Toy API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/v1/health:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controllers.healthResponse'
          description: OK
      summary: Health check
      tags:
      - health
  /api/v1/shader:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/controllers.createShaderRequest'
              description: New shader
              summary: body
        description: New shader
        required: true
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the new shader
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Create a shader
      tags:
      - shader
  /api/v1/shader/{id}:
    get:
      description: Anonymous users see public and unlisted shaders. Logged-in users
        also see their own private ones.
      parameters:
      - description: Shader ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controllers.shaderResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Get a shader
      tags:
      - shader
    put:
      description: Partial update. Omitted fields are left unchanged.
      parameters:
      - description: Shader ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/controllers.updateShaderRequest'
              description: Changes
              summary: body
        description: Changes
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controllers.shaderResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Update a shader
      tags:
      - shader
  /api/v1/user/login:
    post:
      description: Returns a JWT to send as a bearer token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/controllers.loginRequest'
              description: Credentials
              summary: body
        description: Credentials
        required: true
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: JWT
        "400":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Bad Request
      summary: Log in
      tags:
      - user
  /api/v1/user/me:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controllers.userResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Get the current user
      tags:
      - user
  /api/v1/user/me/shader:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/controllers.shaderSummaryResponse'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: List the current user's shaders
      tags:
      - shader
  /api/v1/user/register:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/controllers.registerRequest'
              description: New user
              summary: body
        description: New user
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Bad Request
      summary: Register a new user
      tags:
      - user
