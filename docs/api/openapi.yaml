components:
  schemas:
    Author:
      properties:
        username:
          type: string
      type: object
    Error:
      properties:
        causedBy:
          type: string
        errorClass:
          type: string
      type: object
    Gallery:
      properties:
        shaders:
          items:
            $ref: '#/components/schemas/ShaderSummary'
          type: array
          uniqueItems: false
      type: object
    Health:
      properties:
        status:
          type: string
      type: object
    Login:
      properties:
        password:
          type: string
        username:
          type: string
      type: object
    Me:
      properties:
        createdAt:
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
          type: string
        email:
          type: string
        emailVerification:
          type: string
        isAdmin:
          type: boolean
        updatedAt:
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
          type: string
        username:
          type: string
        visibility:
          type: string
      type: object
    Profile:
      properties:
        createdAt:
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
          type: string
        private:
          type: boolean
        username:
          type: string
      type: object
    Register:
      properties:
        email:
          type: string
        password:
          type: string
        username:
          type: string
      type: object
    Shader:
      properties:
        author:
          $ref: '#/components/schemas/Author'
        content:
          type: string
        createdAt:
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
        updatedAt:
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
          type: string
        visibility:
          type: string
      type: object
    ShaderInput:
      properties:
        content:
          type: string
        description:
          type: string
        name:
          type: string
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
        visibility:
          type: string
      type: object
    ShaderSummary:
      properties:
        author:
          $ref: '#/components/schemas/Author'
        createdAt:
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
        updatedAt:
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
          type: string
        visibility:
          type: string
      type: object
    UpdateMe:
      properties:
        email:
          type: string
        username:
          type: string
        visibility:
          type: string
      type: object
  securitySchemes:
    SessionCookie:
      description: Set by POST /login.
      in: cookie
      name: session
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: |-
    Routes answer with JSON when the request's Accept prefers application/json, and with HTML
    otherwise. Only the JSON is described here. Request bodies can be JSON or form fields.
  title: WGSL Toy
  version: "1.0"
openapi: 3.1.0
paths:
  /:
    get:
      description: The 100 most recently updated public shaders. This is the home
        page in a browser.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gallery'
          description: OK
      summary: List public shaders
      tags:
      - shaders
  /health:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: OK
      summary: Health check
      tags:
      - health
  /login:
    get:
      description: Only HTML.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
            text/html:
              schema:
                type: string
          description: The login page
        "406":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/html:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Acceptable
      summary: Login page
      tags:
      - auth
    post:
      description: Sets the session cookie.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
              description: Credentials
              summary: credentials
          application/x-www-form-urlencoded:
            schema:
              type: object
          multipart/form-data:
            schema:
              type: object
        description: Credentials
        required: true
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              description: The session cookie
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The username or password is wrong
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Entity
      summary: Sign in
      tags:
      - auth
  /logout:
    post:
      description: Ends the session and clears its cookie. Signing out without a session
        is fine too.
      responses:
        "204":
          description: No Content
      summary: Sign out
      tags:
      - auth
  /me:
    delete:
      description: |-
        Signs out too. The user's shaders are handled by shaderDisposition: default deletes the
        private ones and keeps the rest without an author, remove_all deletes them all, and
        donate_all keeps them all without an author.
      parameters:
      - description: What happens to the user's shaders
        in: query
        name: shaderDisposition
        schema:
          default: default
          enum:
          - default
          - remove_all
          - donate_all
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Entity
      security:
      - SessionCookie: []
      summary: Delete the signed in user's account
      tags:
      - users
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
      security:
      - SessionCookie: []
      summary: Get the signed in user
      tags:
      - users
    put:
      description: Changing the email marks it as unverified.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMe'
              description: The account's new details
              summary: user
          application/x-www-form-urlencoded:
            schema:
              type: object
          multipart/form-data:
            schema:
              type: object
        description: The account's new details
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The username or email is taken
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Entity
      security:
      - SessionCookie: []
      summary: Replace the signed in user's account details
      tags:
      - users
  /register:
    get:
      description: Only HTML.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
            text/html:
              schema:
                type: string
          description: The register page
        "406":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/html:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Acceptable
      summary: Register page
      tags:
      - auth
    post:
      description: The account starts with an unverified email, and isn't signed in.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
              description: The new account
              summary: account
          application/x-www-form-urlencoded:
            schema:
              type: object
          multipart/form-data:
            schema:
              type: object
        description: The new account
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
          description: Created
          headers:
            Location:
              description: The new user's profile URL
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The username or email is taken
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Entity
      summary: Create an account
      tags:
      - auth
  /shader/{id}:
    get:
      deprecated: true
      description: Redirects to /shaders/{id}.
      parameters:
      - description: Shader ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "302":
          description: Found
      summary: Old shader link
      tags:
      - shaders
  /shader/{id}/edit:
    get:
      deprecated: true
      description: Redirects to /shaders/{id}.
      parameters:
      - description: Shader ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "302":
          description: Found
      summary: Old shader link
      tags:
      - shaders
  /shaders:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShaderInput'
              description: The new shader
              summary: shader
          application/x-www-form-urlencoded:
            schema:
              type: object
          multipart/form-data:
            schema:
              type: object
        description: The new shader
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shader'
          description: Created
          headers:
            Location:
              description: The new shader's URL
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Entity
      security:
      - SessionCookie: []
      summary: Create a shader
      tags:
      - shaders
  /shaders/{id}:
    delete:
      description: The author and admins can delete a shader.
      parameters:
      - description: Shader ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
      security:
      - SessionCookie: []
      summary: Delete a shader
      tags:
      - shaders
    get:
      description: Anyone can get public and unlisted shaders, only the author and
        admins can get private ones.
      parameters:
      - description: Shader ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shader'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
      summary: Get a shader
      tags:
      - shaders
    put:
      description: Every field is replaced, including ones left out. Only the author
        can update a shader.
      parameters:
      - description: Shader ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShaderInput'
              description: The shader's new fields
              summary: shader
          application/x-www-form-urlencoded:
            schema:
              type: object
          multipart/form-data:
            schema:
              type: object
        description: The shader's new fields
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shader'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Entity
      security:
      - SessionCookie: []
      summary: Replace a shader
      tags:
      - shaders
  /users/{username}:
    get:
      description: |-
        A private account's profile has only its username, unless it's the signed in user's or the
        viewer is an admin.
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
      summary: Get a user's profile
      tags:
      - users
