extends ./layout.html
{{define "content"}}
<h1>{{.Shader.Name}}</h1>
{{if .Shader.CreatedBy}}<p>by <a href="/{{.Shader.CreatedBy}}">{{.Shader.CreatedBy}}</a></p>{{end}}
{{if .Shader.Description}}<p>{{.Shader.Description}}</p>{{end}}
{{if .CanEdit}}<a href="/shader/{{.Shader.ID}}/edit">edit</a>{{end}}
<pre><code>{{.Shader.Content}}</code></pre>
{{end}}
