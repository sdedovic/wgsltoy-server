extends ./layout.html
{{define "content"}}
<h1>Edit Shader</h1>
<form id="editor-form" data-shader-id="{{.Shader.ID}}">
    <div>
        <label>Name<br><input name="name" value="{{.Shader.Name}}" required></label>
    </div>
    <div>
        <label>Visibility<br>
        <select name="visibility">
            <option value="public" {{if eq (print .Shader.Visibility) "public"}}selected{{end}}>public</option>
            <option value="unlisted" {{if eq (print .Shader.Visibility) "unlisted"}}selected{{end}}>unlisted</option>
            <option value="private" {{if eq (print .Shader.Visibility) "private"}}selected{{end}}>private</option>
        </select>
        </label>
    </div>
    <div>
        <label>Description<br><textarea name="description">{{.Shader.Description}}</textarea></label>
    </div>
    <div>
        <label>Tags (comma separated)<br><input name="tags" value="{{range $i, $t := .Shader.Tags}}{{if $i}},{{end}}{{$t}}{{end}}"></label>
    </div>
    <div>
        <label>Content<br><textarea name="content" rows="20" cols="80">{{.Shader.Content}}</textarea></label>
    </div>
    <button type="submit">save</button>
</form>
{{end}}
